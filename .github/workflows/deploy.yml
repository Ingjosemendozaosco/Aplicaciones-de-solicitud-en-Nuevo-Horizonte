name: CI/CD Spring Boot

on:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Dar permisos al Maven Wrapper
        run: chmod +x mvnw

      - name: 4. Ejecutar Pruebas y Build
        run: ./mvnw test package

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 5. Desplegar en Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"