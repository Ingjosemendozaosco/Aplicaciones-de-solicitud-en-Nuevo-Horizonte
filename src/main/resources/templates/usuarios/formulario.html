<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${edicion} ? 'Editar usuario - Nuevo Horizonte' : 'Nuevo usuario - Nuevo Horizonte'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/icons :: icons}"></div>
<header th:replace="~{fragments/topbar :: topbar}"></header>

<main class="container container--narrow">
    <a th:href="@{/usuarios}" class="back">
        <svg class="icon"><use href="#i-arrow-left"/></svg>
        Volver a usuarios
    </a>

    <div class="page-head">
        <div>
            <span class="eyebrow">
                <svg class="icon"><use href="#i-users"/></svg>
                Seguridad
            </span>
            <h1 th:text="${edicion} ? 'Editar usuario' : 'Nuevo usuario'"></h1>
            <p class="subtitle">Datos de acceso y rol del usuario.</p>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-error">
        <svg class="icon"><use href="#i-alert"/></svg>
        <span th:text="${error}"></span>
    </div>

    <section class="card">
        <form th:action="${edicion} ? @{'/usuarios/' + ${usuario.id}} : @{/usuarios}"
              method="post" th:object="${usuario}">
            <div class="grid">
                <div class="field">
                    <label for="username">
                        <svg class="icon"><use href="#i-user"/></svg>
                        Usuario
                    </label>
                    <input id="username" type="text" th:field="*{username}"
                           placeholder="Ej: AP" required maxlength="50">
                </div>
                <div class="field">
                    <label for="email">
                        <svg class="icon"><use href="#i-file"/></svg>
                        Correo
                    </label>
                    <input id="email" type="email" th:field="*{email}"
                           placeholder="usuario@nuevohorizonte.com" required maxlength="100">
                </div>
                <div class="field">
                    <label for="password">
                        <svg class="icon"><use href="#i-lock"/></svg>
                        Contraseña
                    </label>
                    <input id="password" type="password" th:field="*{password}"
                           th:placeholder="${edicion} ? 'Dejar en blanco para conservar' : 'Contraseña inicial'"
                           th:required="${!edicion}">
                </div>
                <div class="field full">
                    <label>
                        <svg class="icon"><use href="#i-key"/></svg>
                        Roles (puede seleccionar varios)
                    </label>
                    <div class="modulos-grid" style="margin-top:2px;">
                        <label class="modulo-chip" th:each="r : ${roles}">
                            <input type="checkbox" th:field="*{roles}" th:value="${r}">
                            <span th:text="${r}"></span>
                        </label>
                    </div>
                    <p class="form-hint" id="cargoPreview"></p>
                </div>
                <div class="field">
                    <label for="tipoVigencia">
                        <svg class="icon"><use href="#i-clock"/></svg>
                        Vigencia de los roles
                    </label>
                    <select id="tipoVigencia" th:field="*{tipoVigencia}">
                        <option value="DEFINITIVO">Definitivo</option>
                        <option value="TEMPORAL">Temporal</option>
                    </select>
                </div>
                <div class="field" id="campoFechaFinRol" style="display:none;">
                    <label for="fechaFinRol">
                        <svg class="icon"><use href="#i-calendar"/></svg>
                        Fecha fin del rol
                    </label>
                    <input id="fechaFinRol" type="date" th:field="*{fechaFinRol}">
                    <small style="color:var(--muted);display:block;margin-top:.35rem;">
                        El rol dejará de aplicar automáticamente en esa fecha.
                    </small>
                </div>
                <div class="field full">
                    <label class="form-check">
                        <input type="checkbox" th:field="*{activo}">
                        Usuario activo
                    </label>
                </div>
            </div>

            <div class="actions">
                <a th:href="@{/usuarios}" class="btn btn-secondary">
                    <svg class="icon"><use href="#i-arrow-left"/></svg>
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary">
                    <svg class="icon"><use href="#i-save"/></svg>
                    Guardar usuario
                </button>
            </div>
        </form>
    </section>
</main>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const tipo = document.getElementById('tipoVigencia');
    const campo = document.getElementById('campoFechaFinRol');
    const fecha = document.getElementById('fechaFinRol');
    function actualizar() {
        const temporal = tipo.value === 'TEMPORAL';
        campo.style.display = temporal ? '' : 'none';
        fecha.required = temporal;
    }
    tipo.addEventListener('change', actualizar);
    actualizar();

    const JERARQUIA = {'Gerencia':1,'Administración':2,'Area de Ventas':3,'Area de Producto':4};
    const CARGOS = {
        'Gerencia+Administración':'Gerente Administrativo',
        'Area de Ventas+Area de Producto':'Gerente Comercial (Líder de Producto y Ventas)',
        'Gerencia+Area de Ventas':'Director Comercial',
        'Gerencia+Area de Producto':'Gerente de Producto (Product Manager)',
        'Administración+Area de Ventas':'Administrador Comercial',
        'Administración+Area de Producto':'Administrador de Operaciones y Productos',
        'Gerencia+Administración+Area de Ventas':'Gerente Comercial y Administrativo',
        'Gerencia+Administración+Area de Producto':'Gerente de Operaciones (COO)',
        'Gerencia+Area de Ventas+Area de Producto':'Director de Negocio y Producto',
        'Administración+Area de Ventas+Area de Producto':'Coordinador Operativo de Productos y Ventas',
        'Gerencia+Administración+Area de Ventas+Area de Producto':'Gerente General (CEO / Director Ejecutivo)'
    };
    const preview = document.getElementById('cargoPreview');
    function actualizarCargo() {
        const marcados = Array.from(document.querySelectorAll('input[name="roles"]:checked')).map(c => c.value);
        marcados.sort((a,b) => (JERARQUIA[a]||99) - (JERARQUIA[b]||99));
        if (marcados.length === 0) {
            preview.textContent = 'Seleccione al menos un rol.';
        } else if (marcados.length === 1) {
            preview.textContent = 'Cargo formal: Empleado (un solo rol).';
        } else {
            const clave = marcados.join('+');
            const cargo = CARGOS[clave] || 'Empleado';
            preview.textContent = 'Cargo formal: ' + cargo;
        }
    }
    document.querySelectorAll('input[name="roles"]').forEach(c => c.addEventListener('change', actualizarCargo));
    actualizarCargo();
});
</script>
</body>
</html>
