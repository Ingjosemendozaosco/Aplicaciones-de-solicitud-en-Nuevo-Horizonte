<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${edicion} ? 'Editar usuario - Nuevo Horizonte' : 'Nuevo usuario - Nuevo Horizonte'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/icons :: icons}"></div>
<header th:replace="~{fragments/topbar :: topbar}"></header>

<main class="container container--narrow">
    <a th:href="@{/usuarios}" class="back">
        <svg class="icon"><use href="#i-arrow-left"/></svg>
        Volver a usuarios
    </a>

    <div class="page-head">
        <div>
            <span class="eyebrow">
                <svg class="icon"><use href="#i-users"/></svg>
                Seguridad
            </span>
            <h1 th:text="${edicion} ? 'Editar usuario' : 'Nuevo usuario'"></h1>
            <p class="subtitle">Datos de acceso y rol del usuario.</p>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-error">
        <svg class="icon"><use href="#i-alert"/></svg>
        <span th:text="${error}"></span>
    </div>

    <section class="card">
        <form th:action="${edicion} ? @{'/usuarios/' + ${usuario.id}} : @{/usuarios}"
              method="post" th:object="${usuario}">
            <div class="grid">
                <div class="field">
                    <label for="username">
                        <svg class="icon"><use href="#i-user"/></svg>
                        Usuario
                    </label>
                    <input id="username" type="text" th:field="*{username}"
                           placeholder="Ej: AP" required maxlength="50">
                </div>
                <div class="field">
                    <label for="email">
                        <svg class="icon"><use href="#i-file"/></svg>
                        Correo
                    </label>
                    <input id="email" type="email" th:field="*{email}"
                           placeholder="usuario@nuevohorizonte.com" required maxlength="100">
                </div>
                <div class="field">
                    <label for="password">
                        <svg class="icon"><use href="#i-lock"/></svg>
                        Contraseña
                    </label>
                    <input id="password" type="password" th:field="*{password}"
                           th:placeholder="${edicion} ? 'Dejar en blanco para conservar' : 'Contraseña inicial'"
                           th:required="${!edicion}">
                </div>
                <div class="field">
                    <label for="rolNombre">
                        <svg class="icon"><use href="#i-key"/></svg>
                        Rol
                    </label>
                    <select id="rolNombre" th:field="*{rolNombre}">
                        <option value="">Sin rol</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <div class="field full">
                    <label class="form-check">
                        <input type="checkbox" th:field="*{activo}">
                        Usuario activo
                    </label>
                </div>
            </div>

            <div class="actions">
                <a th:href="@{/usuarios}" class="btn btn-secondary">
                    <svg class="icon"><use href="#i-arrow-left"/></svg>
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary">
                    <svg class="icon"><use href="#i-save"/></svg>
                    Guardar usuario
                </button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
