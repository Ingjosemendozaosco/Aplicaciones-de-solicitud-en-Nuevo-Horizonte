<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios - Nuevo Horizonte</title>
    <script>
        (function () {
            try {
                var guardado = localStorage.getItem('nh-theme');
                var tema = guardado || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', tema);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#contenido">Saltar al contenido</a>
<div th:replace="~{fragments/icons :: icons}"></div>
<header th:replace="~{fragments/topbar :: topbar}"></header>

<main id="contenido" tabindex="-1" class="container">
    <div class="page-head">
        <div>
            <span class="eyebrow">
                <svg class="icon"><use href="#i-users"/></svg>
                Seguridad
            </span>
            <h1>Usuarios</h1>
            <p class="subtitle">Gestión de usuarios, roles y estado de acceso.</p>
        </div>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">
            <svg class="icon"><use href="#i-plus"/></svg>
            Nuevo usuario
        </a>
    </div>

    <div th:if="${mensaje}" class="alert" role="status" aria-live="polite">
        <svg class="icon"><use href="#i-check-circle"/></svg>
        <span th:text="${mensaje}"></span>
    </div>
    <div th:if="${error}" class="alert alert-error" role="alert" aria-live="assertive">
        <svg class="icon"><use href="#i-alert"/></svg>
        <span th:text="${error}"></span>
    </div>

    <section class="card card--table">
        <div class="table-toolbar">
            <div class="search-box">
                <svg class="icon"><use href="#i-search"/></svg>
                <input id="buscarUsuarios" type="search" autocomplete="off"
                       placeholder="Buscar usuario, correo, cargo o rol...">
            </div>
            <span class="table-count" id="contadorUsuarios" role="status" aria-live="polite"
                  th:text="|${#lists.size(usuarios)} usuarios|"></span>
        </div>
        <div class="table-wrap">
            <table id="tablaUsuarios">
                <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Correo</th>
                    <th>Cargo formal</th>
                    <th>Roles</th>
                    <th>Estado</th>
                    <th>Creado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}"
                    th:attr="data-texto=${#strings.toLowerCase(u.username + ' ' + (u.email != null ? u.email : '') + ' ' + (u.cargoFormal != null ? u.cargoFormal : '') + ' ' + (u.roles != null ? #strings.listJoin(u.roles, ' ') : '') + ' ' + (u.activo ? 'activo' : 'inactivo'))}">
                    <td>
                        <strong th:text="${u.username}"></strong>
                    </td>
                    <td th:text="${u.email}"></td>
                    <td>
                        <span th:text="${u.cargoFormal}" style="font-weight:600;color:var(--blue-800);"></span>
                    </td>
                    <td>
                        <span class="role-chip" th:each="r : ${u.roles}" th:text="${r}"></span>
                        <span th:if="${#lists.isEmpty(u.roles)}" class="muted">Sin rol</span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${u.activo} ? 'aprobada' : 'rechazada'"
                              th:text="${u.activo} ? 'ACTIVO' : 'INACTIVO'"></span>
                    </td>
                    <td th:text="${u.fechaCreacion != null ? u.fechaCreacion.toLocalDate() : '—'}"></td>
                    <td>
                        <div class="actions-cell">
                            <a th:href="@{'/usuarios/' + ${u.id} + '/editar'}" class="btn btn-ghost">
                                <svg class="icon icon-xs"><use href="#i-edit"/></svg>
                                Editar
                            </a>
                            <form th:action="@{'/usuarios/' + ${u.id} + '/estado'}" method="post" class="inline-form">
                                <input type="hidden" name="activo" th:value="${!u.activo}">
                                <button type="submit" class="btn btn-ghost">
                                    <svg class="icon icon-xs"><use href="#i-power"/></svg>
                                    <span th:text="${u.activo} ? 'Desactivar' : 'Activar'"></span>
                                </button>
                            </form>
                            <form th:action="@{'/usuarios/' + ${u.id} + '/eliminar'}" method="post"
                                  class="inline-form"
                                  onsubmit="return confirm('¿Eliminar este usuario?');">
                                <button type="submit" class="btn btn-ghost btn-ghost--danger">
                                    <svg class="icon icon-xs"><use href="#i-trash"/></svg>
                                    Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="table-empty-filter" id="sinUsuarios" style="display:none;">
            No hay usuarios que coincidan con la búsqueda.
        </div>
        <div class="table-pagination" th:if="${!#lists.isEmpty(usuarios)}">
            <button type="button" class="pager-btn" id="usuariosAnterior">Anterior</button>
            <div class="pager-nums" id="usuariosNumeros"></div>
            <button type="button" class="pager-btn" id="usuariosSiguiente">Siguiente</button>
        </div>
    </section>
</main>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const filas = Array.prototype.slice.call(
        document.querySelectorAll('#tablaUsuarios tbody tr'));
    const buscador = document.getElementById('buscarUsuarios');
    const contador = document.getElementById('contadorUsuarios');
    const sinResultados = document.getElementById('sinUsuarios');
    const prev = document.getElementById('usuariosAnterior');
    const next = document.getElementById('usuariosSiguiente');
    const nums = document.getElementById('usuariosNumeros');
    if (!filas.length) {
        return;
    }
    const estado = { texto: '', pagina: 1, porPagina: 8 };

    function normalizar(valor) {
        return (valor || '').toString().toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function filtradas() {
        return filas.filter(function (fila) {
            return !estado.texto
                || normalizar(fila.dataset.texto).indexOf(estado.texto) !== -1;
        });
    }

    function pintarPaginacion(totalPaginas) {
        if (nums) {
            nums.innerHTML = '';
            for (let i = 1; i <= totalPaginas; i++) {
                const boton = document.createElement('button');
                boton.type = 'button';
                boton.className = 'pager-num' + (i === estado.pagina ? ' active' : '');
                boton.textContent = i;
                boton.addEventListener('click', function () {
                    estado.pagina = i;
                    render();
                });
                nums.appendChild(boton);
            }
        }
        if (prev) prev.disabled = estado.pagina === 1;
        if (next) next.disabled = estado.pagina >= totalPaginas;
    }

    function render() {
        const lista = filtradas();
        const totalPaginas = Math.max(1, Math.ceil(lista.length / estado.porPagina));
        if (estado.pagina > totalPaginas) {
            estado.pagina = totalPaginas;
        }
        const inicio = (estado.pagina - 1) * estado.porPagina;
        const visibles = lista.slice(inicio, inicio + estado.porPagina);
        filas.forEach(function (fila) { fila.style.display = 'none'; });
        visibles.forEach(function (fila) { fila.style.display = ''; });
        if (contador) {
            contador.textContent = lista.length === 0
                ? '0 usuarios'
                : (inicio + 1) + '–' + Math.min(inicio + estado.porPagina, lista.length)
                    + ' de ' + lista.length;
        }
        if (sinResultados) {
            sinResultados.style.display = lista.length === 0 ? 'block' : 'none';
        }
        pintarPaginacion(totalPaginas);
    }

    if (buscador) {
        buscador.addEventListener('input', function () {
            estado.texto = normalizar(buscador.value.trim());
            estado.pagina = 1;
            render();
        });
    }
    if (prev) {
        prev.addEventListener('click', function () {
            if (estado.pagina > 1) {
                estado.pagina--;
                render();
            }
        });
    }
    if (next) {
        next.addEventListener('click', function () {
            estado.pagina++;
            render();
        });
    }
    render();
});
</script>
</body>
</html>
