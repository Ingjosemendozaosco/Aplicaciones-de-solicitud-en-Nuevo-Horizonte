<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
        <meta charset="UTF-8">
<script>
        (function () {
            try {
                var guardado = localStorage.getItem('nh-theme');
                var tema = guardado || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', tema);
            } catch (e) {}
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel - Nuevo Horizonte</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#contenido">Saltar al contenido</a>
<div th:replace="~{fragments/icons :: icons}"></div>
<header th:replace="~{fragments/topbar :: topbar}"></header>

<main id="contenido" tabindex="-1" class="container">
    <div class="page-head">
        <div>
            <span class="eyebrow">
                <svg class="icon"><use href="#i-grid"/></svg>
                Panel
            </span>
            <h1>Panel de control</h1>
            <p class="subtitle"
               th:text="${visionGlobal ? 'Vista global del sistema de solicitudes' : 'Tu actividad y el estado de tus solicitudes'}"></p>
        </div>
    </div>

    <section class="card dash-summary">
        <div class="dash-summary__head">
            <div>
                <h2 class="card-title">
                    <svg class="icon"><use href="#i-chart"/></svg>
                    Resumen de solicitudes
                </h2>
                <p class="dash-summary__hint"
                   th:text="${visionGlobal ? 'Indicadores generales del sistema.' : 'Consulta tus indicadores de un vistazo.'}"></p>
            </div>
            <a th:href="@{/solicitudes}" class="btn btn-secondary btn-sm">
                <svg class="icon"><use href="#i-list"/></svg>
                Ver solicitudes
            </a>
        </div>

        <div class="dash-metrics">
            <article class="dash-metric">
                <div class="dash-metric__top">
                    <span class="dash-metric__icon">
                        <svg class="icon"><use href="#i-file"/></svg>
                    </span>
                    <span class="dash-metric__label">Total</span>
                </div>
                <strong class="dash-metric__value" th:text="${totalSolicitudes}">0</strong>
            </article>
            <article class="dash-metric dash-metric--warn">
                <div class="dash-metric__top">
                    <span class="dash-metric__icon">
                        <svg class="icon"><use href="#i-clock"/></svg>
                    </span>
                    <span class="dash-metric__label">Pendientes</span>
                </div>
                <strong class="dash-metric__value" th:text="${pendientes}">0</strong>
            </article>
            <article class="dash-metric dash-metric--info">
                <div class="dash-metric__top">
                    <span class="dash-metric__icon">
                        <svg class="icon"><use href="#i-edit"/></svg>
                    </span>
                    <span class="dash-metric__label">Borradores</span>
                </div>
                <strong class="dash-metric__value" th:text="${borradores}">0</strong>
            </article>
            <article class="dash-metric dash-metric--success">
                <div class="dash-metric__top">
                    <span class="dash-metric__icon">
                        <svg class="icon"><use href="#i-check-circle"/></svg>
                    </span>
                    <span class="dash-metric__label">Aprobadas</span>
                </div>
                <strong class="dash-metric__value" th:text="${aprobadas}">0</strong>
            </article>
            <article class="dash-metric dash-metric--danger">
                <div class="dash-metric__top">
                    <span class="dash-metric__icon">
                        <svg class="icon"><use href="#i-x"/></svg>
                    </span>
                    <span class="dash-metric__label">Rechazadas</span>
                </div>
                <strong class="dash-metric__value" th:text="${rechazadas}">0</strong>
            </article>
        </div>

        <div sec:authorize="hasRole('Administración')" class="dash-admin">
            <span class="dash-admin__label">
                <svg class="icon"><use href="#i-shield"/></svg>
                Administración
            </span>
            <div class="dash-admin__items">
                <span class="dash-admin__item">
                    <svg class="icon"><use href="#i-users"/></svg>
                    <strong th:text="${totalUsuarios}">0</strong>
                    Usuarios
                </span>
                <span class="dash-admin__item">
                    <svg class="icon"><use href="#i-key"/></svg>
                    <strong th:text="${totalRoles}">0</strong>
                    Roles
                </span>
            </div>
        </div>
    </section>

    <section class="card" style="margin-top:22px;">
        <h2 class="card-title">
            <svg class="icon"><use href="#i-chart"/></svg>
            Actividad semanal
        </h2>
        <div class="weekly-chart">
            <div class="weekly-bars">
                <div th:each="item : ${semana}" class="weekly-bar">
                    <div class="bar-label" th:text="${item.dia}"></div>
                    <div class="bar-container">
                        <div class="bar-fill" th:style="'height:' + (${item.count} * 20) + 'px'"></div>
                    </div>
                    <div class="bar-value" th:text="${item.count}"></div>
                </div>
            </div>
        </div>
    </section>

    <section class="card card--table" th:if="${!#lists.isEmpty(recientes)}" style="margin-top:22px;">
        <div class="card-head">
            <h2 class="card-title" style="margin-bottom:0;">
                <svg class="icon"><use href="#i-clock"/></svg>
                Solicitudes recientes
            </h2>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>N°</th>
                    <th>Solicitante</th>
                    <th>Área</th>
                    <th>Recurso</th>
                    <th>Estado</th>
                    <th>Fecha</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${recientes}"
                    th:classappend="${s.estado.toString() == 'PENDIENTE' and !s.visto} ? 'fila-nueva' : ''">
                    <td th:text="${s.numeroSolicitud}"></td>
                    <td th:text="${s.nombreSolicitante}"></td>
                    <td th:text="${s.areaSolicitante}"></td>
                    <td th:text="${s.recursoModulo}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${#strings.toLowerCase(s.estado.toString())}"
                              th:text="${s.estado}"></span>
                    </td>
                    <td th:text="${s.fechaSolicitud}"></td>
                    <td>
                        <a th:href="@{'/solicitudes/' + ${s.idSolicitud}}" class="btn btn-ghost">
                            Ver
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
