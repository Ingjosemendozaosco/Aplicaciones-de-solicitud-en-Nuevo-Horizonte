<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Horizonte Turismo - Solicitud Enviada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success-container {
            background: white;
            padding: 45px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .success-icon {
            font-size: 80px;
            color: #27ae60;
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .numero-solicitud {
            background: #f5f7fa;
            padding: 20px;
            border-radius: 8px;
            border: 2px dashed #667eea;
            margin-bottom: 30px;
        }
        .numero-solicitud label {
            display: block;
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .numero-solicitud span {
            color: #2c3e50;
            font-size: 24px;
            font-weight: bold;
        }
        .btn-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✅</div>
        <h1>Solicitud Enviada</h1>
        <p th:text="${mensajeExito}">Su solicitud ha sido enviada correctamente</p>

        <div class="numero-solicitud">
            <label>Número de Solicitud</label>
            <span th:text="${numeroSolicitud}">0000</span>
        </div>

        <div class="btn-actions">
            <a th:href="@{/dashboard}" class="btn btn-primary">Ir al Dashboard</a>
            <a th:href="@{/formulario}" class="btn btn-secondary">Nueva Solicitud</a>
        </div>
    </div>
</body>
</html>
