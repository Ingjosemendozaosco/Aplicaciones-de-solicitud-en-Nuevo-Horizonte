spring.application.name=demo

# Puerto (Render lo asigna con la variable PORT)
server.port=${PORT:8080}

# ---- Base de datos (todo por variables de entorno) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nuevo-horizonte-solicitudes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jose21}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---- Correo (Resend) - todo por variables de entorno ----
app.resend.enabled=${RESEND_ENABLED:false}
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${RESEND_FROM:onboarding@resend.dev}
# Si tiene valor, todos los correos se envían a esa dirección (modo pruebas)
app.resend.override-to=${RESEND_OVERRIDE_TO:}

# Usuarios demo (cambiar a false en producción)
app.seguridad.seed-demo-usuarios=${SEED_DEMO_USUARIOS:false}

logging.level.org.springframework.security=INFO
